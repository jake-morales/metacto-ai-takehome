{% if voted %}
<form method="post" action="/roadmap/unvote/{{ item.pk }}/"
  hx-post="/roadmap/unvote/{{ item.pk }}/"
  hx-target="#vote-{{ item.pk }}"
  hx-swap="innerHTML">
  {% csrf_token %}
  <button type="submit"
    class="flex flex-col items-center gap-0.5 px-4 py-2 rounded-xl text-xs font-bold bg-orange-500 text-white hover:bg-orange-400 transition min-w-[60px]">
    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 3l-7 7h4v7h6v-7h4L10 3z"/></svg>
    <span>{{ item.vote_count }}</span>
  </button>
</form>
{% else %}
<form method="post" action="/roadmap/vote/{{ item.pk }}/"
  hx-post="/roadmap/vote/{{ item.pk }}/"
  hx-target="#vote-{{ item.pk }}"
  hx-swap="innerHTML">
  {% csrf_token %}
  <button type="submit"
    class="flex flex-col items-center gap-0.5 px-4 py-2 rounded-xl text-xs font-bold bg-white border-2 border-gray-200 text-gray-500 hover:border-orange-400 hover:text-orange-600 transition min-w-[60px]">
    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 3l-7 7h4v7h6v-7h4L10 3z"/></svg>
    <span>{{ item.vote_count }}</span>
  </button>
</form>
{% endif %}

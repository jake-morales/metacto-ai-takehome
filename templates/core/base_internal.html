{% extends "core/base.html" %}
{% block extra_head %}
<style>
  #main-sidebar { transition: width 0.2s ease; overflow: hidden; }
  #main-sidebar.collapsed { width: 3rem; }
  #main-sidebar.collapsed .sidebar-label,
  #main-sidebar.collapsed .sidebar-section,
  #main-sidebar.collapsed .sidebar-brand-text { display: none; }
  #main-sidebar.collapsed .sidebar-link { justify-content: center; padding-left: 0; padding-right: 0; }
  #main-sidebar.collapsed .sidebar-footer-link { justify-content: center; padding-left: 0; padding-right: 0; }
  #main-sidebar.collapsed #sidebar-toggle-btn { justify-content: center; }
</style>
{% endblock %}
{% block body %}
<div class="flex min-h-screen bg-slate-900">
  <!-- Sidebar -->
  <aside id="main-sidebar" class="w-56 bg-slate-800 flex-shrink-0 flex flex-col">
    <div class="px-5 py-5 border-b border-slate-700 flex items-center justify-between min-w-0">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-xl flex-shrink-0">🍔</span>
        <div class="sidebar-brand-text min-w-0">
          <div class="text-white font-bold text-sm leading-tight">BiteFlight</div>
          <div class="text-indigo-400 text-xs font-medium">Product Team</div>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      <p class="sidebar-section text-slate-500 text-xs font-semibold uppercase tracking-wider px-2 mb-2">Analysis</p>
      <a href="/internal/reports/" title="AI Reports" class="sidebar-link flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if request.path == '/internal/reports/' or '/internal/reports/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span class="flex-shrink-0">💬</span><span class="sidebar-label">AI Reports</span>
      </a>
      <a href="/internal/clusters/" title="Clusters" class="sidebar-link flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/clusters/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span class="flex-shrink-0">🔗</span><span class="sidebar-label">Clusters</span>
      </a>
      <a href="/internal/goals/" title="Goals & Mission" class="sidebar-link flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/goals/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span class="flex-shrink-0">🎯</span><span class="sidebar-label">Goals & Mission</span>
      </a>

      <p class="sidebar-section text-slate-500 text-xs font-semibold uppercase tracking-wider px-2 mb-2 mt-4">Planning</p>
      <a href="/internal/roadmap/" title="Roadmap" class="sidebar-link flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/roadmap/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span class="flex-shrink-0">🗺️</span><span class="sidebar-label">Roadmap</span>
      </a>
    </nav>

    <div class="px-3 py-2 border-t border-slate-700 space-y-1">
      <a href="/roadmap/" title="View Customer Site" class="sidebar-footer-link flex items-center gap-2 px-2 py-2 rounded-lg text-xs text-slate-400 hover:text-slate-300 transition">
        <span class="flex-shrink-0">↗</span><span class="sidebar-label">View Customer Site</span>
      </a>
      <button id="sidebar-toggle-btn" onclick="toggleMainSidebar()"
        class="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-xs text-slate-500 hover:text-slate-300 hover:bg-slate-700 transition">
        <span id="sidebar-toggle-icon" class="flex-shrink-0">◀</span><span class="sidebar-label">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
      <h1 class="text-white font-semibold text-lg">{% block page_title %}Dashboard{% endblock %}</h1>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script>
  function toggleMainSidebar() {
    const sidebar = document.getElementById('main-sidebar');
    const icon = document.getElementById('sidebar-toggle-icon');
    const collapsed = sidebar.classList.toggle('collapsed');
    sidebar.style.width = collapsed ? '3rem' : '14rem';
    icon.textContent = collapsed ? '▶' : '◀';
    localStorage.setItem('main-sidebar-collapsed', collapsed);
  }

  // Restore state on load
  (function() {
    if (localStorage.getItem('main-sidebar-collapsed') === 'true') {
      const sidebar = document.getElementById('main-sidebar');
      const icon = document.getElementById('sidebar-toggle-icon');
      sidebar.classList.add('collapsed');
      sidebar.style.width = '3rem';
      icon.textContent = '▶';
    }
  })();
</script>
{% endblock %}

{% extends "core/base.html" %}
{% block body %}
<div class="flex min-h-screen bg-slate-900">
  <!-- Sidebar -->
  <aside class="w-56 bg-slate-800 flex-shrink-0 flex flex-col">
    <div class="px-5 py-5 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <span class="text-xl">🍔</span>
        <div>
          <div class="text-white font-bold text-sm leading-tight">BiteFlight</div>
          <div class="text-indigo-400 text-xs font-medium">Product Team</div>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider px-2 mb-2">Analysis</p>
      <a href="/internal/reports/" class="flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if request.path == '/internal/reports/' or '/internal/reports/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span>💬</span> AI Reports
      </a>
      <a href="/internal/clusters/" class="flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/clusters/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span>🔗</span> Clusters
      </a>
      <a href="/internal/goals/" class="flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/goals/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span>🎯</span> Goals & Mission
      </a>

      <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider px-2 mb-2 mt-4">Planning</p>
      <a href="/internal/roadmap/" class="flex items-center gap-2 px-2 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 hover:text-white transition {% if '/internal/roadmap/' in request.path %}bg-indigo-600 text-white{% endif %}">
        <span>🗺️</span> Roadmap
      </a>
    </nav>

    <div class="px-3 py-4 border-t border-slate-700">
      <a href="/roadmap/" class="flex items-center gap-2 px-2 py-2 rounded-lg text-xs text-slate-400 hover:text-slate-300 transition">
        <span>↗</span> View Customer Site
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4">
      <h1 class="text-white font-semibold text-lg">{% block page_title %}Dashboard{% endblock %}</h1>
    </header>

    <main class="flex-1 p-6 overflow-auto">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
{% endblock %}
